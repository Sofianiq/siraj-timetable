<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام إدارة الجداول الدراسية – جامعة السراج - كلية التقنيات الصحية والطبية</title>
  <meta name="description" content="نظام ويب لإدارة الجداول الدراسية الأسبوعية لأقسام كلية التقنيات الصحية والطبية — جامعة السراج، مع كشف التعارضات والتوليد التلقائي والمزامنة الفورية.">
  <meta name="theme-color" content="#0f4c81">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>يتطلب هذا النظام تفعيل JavaScript في المتصفح.</noscript>
  <div class="loading"><div class="spinner"></div><p>جارٍ التحميل…</p></div>
  <script>
    // إظهار سبب التعطل بدل بقاء «جارٍ التحميل» إذا فشل تحميل أحد ملفات النظام
    function showBootError(msg) {
      var hint = /config\.js/.test(msg)
        ? 'يوجد خطأ في ملف js/config.js. تأكد أن السطر يبدأ بـ <b>export const firebaseConfig</b> (كلمة export مطلوبة) وأن كل القيم بين علامتي تنصيص.'
        : 'تأكد من رفع كل الملفات والمجلدات (css و js) إلى المستودع، ثم حدّث الصفحة.';
      document.body.innerHTML = '<div style="max-width:640px;margin:3rem auto;padding:1.5rem;font-family:Tahoma,sans-serif;direction:rtl;border:2px solid #b91c1c;border-radius:12px;background:#fee2e2;color:#7f1d1d">'
        + '<h2 style="margin-top:0">تعذّر تشغيل النظام</h2><p>' + hint + '</p>'
        + '<p style="direction:ltr;text-align:left;font-family:monospace;font-size:13px;background:#fff;padding:.5rem;border-radius:6px">' + String(msg).replace(/</g, '&lt;') + '</p></div>';
    }
    window.addEventListener('error', function (e) { if (!window.__appStarted) showBootError(e.message || 'خطأ غير معروف'); });
    setTimeout(function () { if (!window.__appStarted) showBootError('انتهت مهلة التحميل. افتح أدوات المطوّر (Console) لمعرفة الخطأ.'); }, 15000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
